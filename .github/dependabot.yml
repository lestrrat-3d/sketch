version: 2
updates:
  # The workflows pin every action to a full commit SHA, so an update is only
  # visible to Dependabot — never to a floating tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init/autobuild/analyze are separate Dependabot dependencies that share
      # one SHA and must move together, or CodeQL fails with a version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
