name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Release gate: the tag is already pushed, but nothing is published until the
  # full CI pipeline (lint, cross-platform tests, doc-sync, govulncheck) passes.
  # A red run blocks goreleaser via `needs`, mirroring helium's conformance-gate.
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
